<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITE - Reviews</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="container nav-inner">

        <a href="index.html" class="logo">
            <span class="logo-mark">B</span>
            BITE
        </a>

        <a href="orders.html" class="btn btn-secondary">
            My Orders
        </a>

    </div>
</nav>

<main class="page">

<div class="container">

    <h1 class="page-title">Reviews & Feedback ⭐</h1>

    <p class="page-subtitle">
        Tell us how your BITE experience was.
    </p>

    <div class="form-card">

        <div class="form-group">
            <label>Rating</label>

            <select id="rating">
                <option value="5">★★★★★ Excellent</option>
                <option value="4">★★★★ Great</option>
                <option value="3">★★★ Good</option>
                <option value="2">★★ Needs improvement</option>
                <option value="1">★ Poor</option>
            </select>
        </div>

        <div class="form-group">
            <label>Your Feedback</label>

            <textarea
                id="feedback"
                placeholder="Tell us about your food and delivery..."
            ></textarea>
        </div>

        <button
            class="btn btn-primary"
            onclick="submitReview()">
            Submit Review
        </button>

    </div>

    <div style="margin-top:35px;">

        <h2>Recent Reviews</h2>

        <div id="reviewsList" style="margin-top:18px;"></div>

    </div>

</div>

</main>

<script src="js/app.js"></script>

<script>
function submitReview() {

    const rating =
        document.getElementById("rating").value;

    const feedback =
        document.getElementById("feedback").value.trim();

    if (!feedback) {
        showToast("Please write your feedback.");
        return;
    }

    const reviews =
        JSON.parse(localStorage.getItem("biteReviews")) || [];

    reviews.unshift({
        rating,
        feedback,
        date: new Date().toLocaleDateString()
    });

    localStorage.setItem(
        "biteReviews",
        JSON.stringify(reviews)
    );

    document.getElementById("feedback").value = "";

    showToast("Thanks for your feedback! ❤️");

    renderReviews();
}

function renderReviews() {

    const reviews =
        JSON.parse(localStorage.getItem("biteReviews")) || [];

    const list =
        document.getElementById("reviewsList");

    if (!reviews.length) {
        list.innerHTML =
            "<p style='color:#8d8798;'>No reviews yet.</p>";
        return;
    }

    list.innerHTML = reviews.map(review => `

        <div class="review-card">

            <div style="color:#d58a00;font-size:20px;">
                ${"★".repeat(Number(review.rating))}
            </div>

            <p style="margin:10px 0;">
                ${review.feedback}
            </p>

            <small style="color:#8d8798;">
                ${review.date}
            </small>

        </div>

    `).join("");
}

document.addEventListener("DOMContentLoaded", renderReviews);
</script>

</body>
</html>
