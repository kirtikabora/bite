<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITE - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="container nav-inner">
        <a href="index.html" class="logo">
            <span class="logo-mark">B</span>
            BITE
        </a>

        <a href="index.html" class="btn btn-secondary">
            ← Home
        </a>
    </div>
</nav>

<main class="login-page">

    <div class="login-card">

        <div class="login-logo">
            <div class="logo" style="justify-content:center;">
                <span class="logo-mark">B</span>
                BITE
            </div>
            <p class="page-subtitle" style="margin-top:8px;">
                Good food. Better mood.
            </p>
        </div>

        <div class="role-switch">
            <button id="userRole" class="active" onclick="setRole('user')">
                👤 User
            </button>

            <button id="adminRole" onclick="setRole('admin')">
                👑 Admin
            </button>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">
                Login
            </button>

        </form>

        <p style="text-align:center;margin-top:18px;color:#8d8798;font-size:13px;">
            Demo project — any valid email/password can be used.
        </p>

    </div>

</main>

<script src="js/app.js"></script>
<script src="js/login.js"></script>

</body>
</html>
