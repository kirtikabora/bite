<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITE - Orders</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="container nav-inner">

        <a href="index.html" class="logo">
            <span class="logo-mark">B</span>
            BITE
        </a>

        <div class="nav-links">
            <a href="menu.html">Menu</a>
            <a href="orders.html">Orders</a>
        </div>

        <a href="cart.html" class="btn btn-secondary">
            🛒 Cart
        </a>

    </div>
</nav>

<main class="page">

<div class="container">

    <h1 class="page-title">My Orders 📦</h1>

    <p class="page-subtitle">
        Your recent BITE orders.
    </p>

    <div id="ordersList"></div>

</div>

</main>

<script src="js/app.js"></script>
<script>
function loadOrders() {

    const orders =
        JSON.parse(localStorage.getItem("biteOrders")) || [];

    const container =
        document.getElementById("ordersList");

    if (!orders.length) {

        container.innerHTML = `
            <div class="form-card">
                <h2>No orders yet.</h2>

                <p style="margin:10px 0 20px;color:#8d8798;">
                    Hungry? Let's fix that. 😋
                </p>

                <a href="menu.html" class="btn btn-primary">
                    Browse Menu
                </a>
            </div>
        `;

        return;
    }

    container.innerHTML = orders.map(order => `

        <div class="review-card">

            <div style="
                display:flex;
                justify-content:space-between;
                gap:15px;
                flex-wrap:wrap;
            ">

                <div>
                    <h3>Order #${order.id}</h3>

                    <p style="
                        color:#8d8798;
                        margin-top:5px;
                        font-size:13px;
                    ">
                        ${order.date}
                    </p>
                </div>

                <span class="status success">
                    ${order.status}
                </span>

            </div>

            <p style="margin:15px 0;">
                ${order.items.map(item =>
                    `${item.name} × ${item.quantity}`
                ).join(", ")}
            </p>

            <strong>Total: ₹${order.total}</strong>

            <div style="margin-top:15px;">

                <a
                    href="tracking.html?id=${order.id}"
                    class="btn btn-primary btn-small">
                    Track Order
                </a>

                <a
                    href="reviews.html?order=${order.id}"
                    class="btn btn-secondary btn-small">
                    Review
                </a>

            </div>

        </div>

    `).join("");
}

document.addEventListener("DOMContentLoaded", loadOrders);
</script>

</body>
</html>
